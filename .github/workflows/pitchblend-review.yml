name: Pitchblend low-risk review

on:
  issue_comment:
    types: [created]

# The workflow itself only reads trusted code from the default branch. All PR
# content is fetched as untrusted data through the API and is never executed.
permissions:
  contents: read

jobs:
  review:
    if: >-
      github.event.issue.pull_request != null &&
      contains(github.event.comment.body, '@pitchblend-ai')
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Create a narrowly scoped Pitchblend installation token
        id: app-token
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2
        with:
          app-id: ${{ vars.PITCHBLEND_APP_ID }}
          private-key: ${{ secrets.PITCHBLEND_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-checks: read
          permission-statuses: read
          permission-contents: read
          permission-issues: write
          permission-pull-requests: write

      - name: Check out trusted evaluator from the default branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Evaluate the pull request
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          PITCHBLEND_GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
          PITCHBLEND_MODEL: ${{ vars.PITCHBLEND_MODEL || 'gpt-5.6-luna' }}
          PITCHBLEND_REASONING_EFFORT: ${{ vars.PITCHBLEND_REASONING_EFFORT || 'high' }}
        run: python3 .github/scripts/pitchblend_review.py
