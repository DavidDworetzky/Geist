name: Qwen Review

# Lower-cost reviewer that runs alongside Claude. Requires the
# OPENROUTER_API_KEY Actions secret. Optional repository variables:
# QWEN_REVIEW_MODEL (default qwen/qwen3.8-max-0902) and
# QWEN_REVIEW_REASONING_EFFORT (default high).
on:
  pull_request:
    types: [opened, ready_for_review]
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]

jobs:
  review:
    if: >-
      (github.event_name == 'pull_request' &&
        github.event.pull_request.draft == false) ||
      (github.event_name == 'issue_comment' &&
        github.event.issue.pull_request &&
        contains(github.event.comment.body, '@qwen review') &&
        contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)) ||
      (github.event_name == 'pull_request_review_comment' &&
        contains(github.event.comment.body, '@qwen review') &&
        contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)) ||
      (github.event_name == 'pull_request_review' &&
        contains(github.event.review.body, '@qwen review') &&
        contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.review.author_association))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: qwen-review-${{ github.event.pull_request.number || github.event.issue.number }}
      cancel-in-progress: false
    # PR content is fetched through the API as untrusted data and never executed.
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Check out trusted reviewer from the default branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Review pull request with Qwen
        env:
          GITHUB_TOKEN: ${{ github.token }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          QWEN_REVIEW_MODEL: ${{ vars.QWEN_REVIEW_MODEL || 'qwen/qwen3.8-max-0902' }}
          QWEN_REVIEW_REASONING_EFFORT: ${{ vars.QWEN_REVIEW_REASONING_EFFORT || 'high' }}
        run: python3 .github/scripts/qwen_review.py
